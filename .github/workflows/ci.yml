name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Typecheck + production build
        run: npm run build

      # Playwright fica fora do package.json (traz ~150 MB de navegador), então
      # é instalado só aqui, sem gravar na árvore de dependências. Versão presa
      # para o CI não quebrar sozinho num release novo.
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: End-to-end checks
        run: npm run test:e2e
