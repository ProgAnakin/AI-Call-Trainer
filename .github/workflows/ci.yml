name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Typecheck + production build
        run: npm run build

      # Playwright e axe-core ficam fora do package.json (o navegador sozinho traz
      # ~150 MB), então são instalados só aqui, sem gravar na árvore de dependências.
      # Versões presas para o CI não quebrar sozinho num release novo. Sem o
      # axe-core a verificação de acessibilidade seria PULADA em silêncio, então ele
      # precisa estar aqui.
      - name: Install Playwright (Chromium) and axe-core
        run: |
          npm install --no-save playwright@1.63.0 axe-core@4.10.2
          npx playwright install --with-deps chromium

      - name: End-to-end checks
        run: npm run test:e2e
